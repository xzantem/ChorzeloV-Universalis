l_english:
 pua_walonian_cavalry_law: "Kawaleria Walońska"
 pua_walonian_cavalry_law_desc: "Po podboju Walony trzeba ostatecznie rozstrzygnac, jak ma funkcjonowac jej tradycja konna. Mozemy zostawic jazde przy szerokiej autonomii, oprzec sluzbe na nadaniach albo wciagnac cala strukture do aparatu panstwowego."
 wolne_choragwie_walonskie: "Wolne Chorągwie Walońskie"
 wolne_choragwie_walonskie_desc: "Walonska jazda zachowuje szeroka autonomie, lokalne przywileje i wlasne obyczaje sluzby. Daje to znakomity efekt bojowy, ale ogranicza bezposrednia kontrole panstwa."
 sluzba_za_nadanie: "Służba za Nadanie"
 sluzba_za_nadanie_desc: "Panstwo utrzymuje kompromisowy model sluzby: nadania i przywileje pozostaja powiazane z obowiazkiem wystawiania jazdy. To rozwiazanie przypomina dawny uklad fiskalno-wojskowy, ale pod bardziej formalnym nadzorem."
 panstwowa_jazda_walonska: "Państwowa Jazda Walońska"
 panstwowa_jazda_walonska_desc: "Walonska jazda zostaje w pelni podporzadkowana panstwu i wlaczona do scentralizowanej struktury wojskowej. Daje to wieksza dyscypline i kontrole, ale uderza w ambicje dawnych elit."
 pua_jewish_communities_status: "Status Gmin Żydowskich"
 pua_jewish_communities_status_desc: "Po podporzadkowaniu dawnych ziem YID panstwo musi okreslic, jak traktowac zydowskie gminy. Mozemy je ograniczac, tolerowac ich odrebnosc albo aktywnie chronic ich szczegolne przywileje."
 ograniczone_gminy: "Ograniczone Gminy"
 ograniczone_gminy_desc: "Panstwo ogranicza swobode i pozycje gmin zydowskich, przedkladajac spokoj religijny i tradycyjny porzadek nad tolerancje oraz zewnetrzny prestiz."
 tolerowana_odrebnosc: "Tolerowana Odrębność"
 tolerowana_odrebnosc_desc: "Gminy zydowskie zachowuja odrebnosc i ograniczona autonomie pod nadzorem panstwa. To rozwiazanie pragmatyczne, szukajace rownowagi miedzy handlem, spokojem i oczekiwaniami dworu."
 chronione_przywileje: "Chronione Przywileje"
 chronione_przywileje_desc: "Panstwo aktywnie zabezpiecza przywileje gmin zydowskich, czyniac z nich istotny element porzadku gospodarczego i polityki tolerancji, nawet kosztem niezadowolenia bardziej tradycyjnych srodowisk."
 pua_cannabis_use: "Użycie Konopi"
 pua_cannabis_use_desc: "Po integracji dawnych ziem GER panstwo musi rozstrzygnac, jaki status prawny maja miec konopie. Mozemy zalegalizowac ich obrot i uzycie, przyjac pragmatyczna dekryminalizacje albo postawic na zakaz i bardziej konserwatywny porzadek."
 pelna_legalizacja: "Pełna Legalizacja"
 pelna_legalizacja_desc: "Panstwo dopuszcza otwarty obrot i uzycie konopi, wzmacniajac miejski handel, eksperymentowanie i bardziej nowoczesny klimat spoleczny."
 dekryminalizacja: "Dekryminalizacja"
 dekryminalizacja_desc: "Wladza rezygnuje z najtwardszego scigania, ale nie promuje otwarcie uzycia konopi. To rozwiazanie pragmatyczne, laczace spokoj spoleczny z umiarkowana kontrola."
 zakaz_konopi: "Zakaz Konopi"
 zakaz_konopi_desc: "Panstwo utrzymuje twardy zakaz, stawiajac na kontrole i konserwatywny porzadek, nawet jesli budzi to dodatkowe tarcia spoleczne."
 pua_femboy_legal_status: "Status Prawny Femboyów"
 pua_femboy_legal_status_desc: "Po integracji dawnych ziem FMB i TMB panstwo musi rozstrzygnac, jaki porzadek obyczajowy ma tam obowiazywac. Mozemy postawic na pelna normalizacje, utrzymac tolerowany kompromis albo wprowadzic twardszy zakaz obyczajowy."
 pelna_normalizacja: "Pełna Normalizacja"
 pelna_normalizacja_desc: "Panstwo uznaje nowy porzadek obyczajowy i aktywnie stabilizuje go przez akceptacje oraz spoleczne wlaczenie dawniej odrebnych srodowisk."
 status_tolerowany: "Status Tolerowany"
 status_tolerowany_desc: "Wladza wybiera rozwiazanie kompromisowe: nie promuje nowych obyczajow, ale utrzymuje ich ograniczona tolerancje pod kontrola administracji."
 zakaz_obyczajowy: "Zakaz Obyczajowy"
 zakaz_obyczajowy_desc: "Panstwo przywraca twardsza norme obyczajowa, wzmacniajac porzadek i kontrole kosztem spolecznej integracji oraz szerszej akceptacji."
 obowiazkowa_silka: "Obowiązkowa Siłka"
 obowiazkowa_silka_desc: "Panstwo czyni trening fizyczny, sylwetke i discipline ciala czescia nowego porzadku spolecznego. Chady zyskuja oficjalne uznanie, a Incele otrzymuja narzucona droge wygladowego i fizycznego awansu."
