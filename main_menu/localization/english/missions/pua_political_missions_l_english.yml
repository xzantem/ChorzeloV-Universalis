l_english:
 pua_political_mission_pack: "Looksmaxia Polityczna"
 pua_political_mission_pack_desc: "Misje polityczne Looksmaxii skupione na stabilizacji wladzy i dalszej ekspansji."
 pua_political_mission_pack_BUTTON_TOOLTIP: "Umocnij panstwo, ustabilizuj rzad i przygotuj Looksmaxie na dalszy rozwoj."
 pua_political_mission_pack_CRITERIA_DESCRIPTION: "Wypelniaj cele polityczne panstwa Looksmaxia."
 mission_escape_from_straszecin: "Ucieczka ze Straszecina"
 mission_escape_from_straszecin_desc: "Profesor Kuk sprawuje rzady tymczasowo, lecz po 180 dniach Ziolkowski ucieknie z zakladu w Straszecinie, obejmie tron i przeniesie stolice do Debicy."
 mission_gorzka_pigulka: "Gorzka Pigułka"
 mission_gorzka_pigulka_desc: "Po ucieczce ze Straszecina Ziolkowski musi zmierzyc sie z brutalna prawda o naturze swiata. Ta misja poprzedza wybor ideologicznej drogi panstwa: Blackpill albo Redpill."
 mission_redpill: "Redpill"
 mission_redpill_desc: "Ziolkowski odrzuca biernosc i fatalizm, wybierajac doktryne sprawczosci, samodoskonalenia i nauki gry spolecznej. Incele maja jeszcze szanse sie podniesc, a PUAsi staja sie mentorami nowego porzadku."
 mission_obowiazkowa_silka: "Obowiązkowa Siłka"
 mission_obowiazkowa_silka_desc: "Sama doktryna nie wystarczy. Redpill trzeba wdrozyc instytucjonalnie, czyniac kult ciala, looksmaxxing i trening fizyczny oficjalnym elementem panstwowego porzadku poprzez uprzywilejowanie Chadów."
 mission_akademia_mogwarts: "Akademia Mogwarts"
 mission_akademia_mogwarts_desc: "Redpill potrzebuje nie tylko silki, ale i instytucji, ktora wychowa kolejne pokolenia mentorów, looksmaxxerów i panstwowych specjalistów od gry spolecznej. Po 90 dniach przygotowan rozpoczniemy budowe Akademii Mogwarts w naszej stolicy."
 mission_reforma_dupczenia: "Reforma Dupczenia"
 mission_reforma_dupczenia_desc: "Sama doktryna Redpill nie wystarczy, jesli panstwo nie zacznie aktywnie przebudowywac stosunkow spolecznych. Po dluzszych przygotowaniach Ziolkowski wdrozy pierwsza, jeszcze niedoskonala Reforme Dupczenia, majaca zwiekszyc dzietnosc i ograniczyc najgorsze skutki hipergamii."
 mission_blackpill: "Blackpill"
 mission_blackpill_desc: "Ziolkowski uznaje brutalna hierarchie swiata za prawde ostateczna. Chady zostaja oficjalnie wyniesione, a rozgoryczeni Incele znajduja uznanie w panstwie twardszym, bardziej cynicznym i bardziej bezwzglednym."
 mission_claim_mcdonalds: "Zniszczyć McDonalds"
 mission_claim_mcdonalds_desc: "Ziolkowski pragnie zniszczyc McDonalds i obalic zla Juleczke. Potrzebujemy czasu, by przygotowac podstawe prawna i polityczna do wojny."
 mission_great_feast: "Wielka Uczta"
 mission_great_feast_desc: "Po upadku McDonaldsa Ziolkowski moze urzadzic uczte godna zwyciezcy. To, co wybierze na stole, odbije sie trwale na jego dalszych rzadow."
 mission_claim_bukajstwo: "Zniszczyć Bukajstwo"
 mission_claim_bukajstwo_desc: "Bukajstwo musi zostac rozliczone za uklady Bukaja i Juleczki Skowron. Przygotujmy uzasadnienie dla przyszlej wojny."
 mission_claim_ger: "Claimy na Rzeszę Dobrzyńską"
 mission_claim_ger_desc: "Po rozprawieniu sie z Bukajstwem mozemy skierowac wzrok na Rzesze Dobryninska. Potrzebujemy czasu, by przygotowac roszczenia do prowincji krosnienskiej i jasielskiej."
 mission_repair_bridge: "Naprawa Mostu"
 mission_repair_bridge_desc: "Skoro Rymanow jest juz w naszych rekach, mozemy odbudowac tamtejszy most i uczynic z niego wazny punkt komunikacyjny dla administracji i wojska."
 mission_fight_femboys: "Walka z Fem(Tom)boyami"
 mission_fight_femboys_desc: "Po przejeciu Mielca mozemy przygotowac sie do ostatecznej rozprawy z FMB i TMB. Potrzebujemy czasu, by uzasadnic pelna aneksje obu panstw."
 mission_fight_yids: "Walka z Żydkami"
 mission_fight_yids_desc: "Skoro Looksmaxia umocnila sie w regionie, mozemy przygotowac pelne roszczenie wobec YID i podjac kroki ku ich aneksji."
 mission_calm_before_the_storm: "Cisza przed Burzą"
 mission_calm_before_the_storm_desc: "Po przygotowaniu roszczen wobec wszystkich najblizszych wrogow nadchodzi chwila oddechu. W czasie pokoju panstwo moze okrzepnac, nabierac sily i wejsc w okres spokojnego wzrostu przed kolejna wielka wojna."
 mission_assault_on_the_gates_of_valona: "Szturm na Bramy Valony"
 mission_assault_on_the_gates_of_valona_desc: "Okres spokoju dobiega konca. Jeśli mamy ruszyć dalej na zachód, trzeba przygotować formalne roszczenia do całej prowincji rzeszowskiej i otworzyć drogę do kolejnej wielkiej kampanii."
 mission_calm_after_the_storm: "Cisza po Burzy"
 mission_calm_after_the_storm_desc: "Po rozbiciu Magny Valony przychodzi moment oddechu. Gdy wojna ucichnie, a zagraniczne roszczenia przestaną zaprzątać uwagę dworu, państwo może znów skupić się na umocnieniu własnego porządku."
 mission_unrest_in_the_country: "Zamieszki w Kraju"
 mission_unrest_in_the_country_desc: "Pod powierzchnia powojennego spokoju narastaly gniew, frustracja i lokalne konflikty. Teraz wszystko wybucha naraz, a Looksmaxia wchodzi w nowy etap kryzysu wewnetrznego, ktory trzeba bedzie rozwiazac politycznie."
 mission_crackdown_on_the_rabble: "Rozprawa z Motłochem"
 mission_crackdown_on_the_rabble_desc: "Skoro kraj juz plonie od zamieszek, trzeba przejsc od biernego znoszenia chaosu do brutalnego przywrocenia porzadku. Rozpedzony motloch odpowie buntem, ale jego rozbicie powinno przynajmniej czesciowo uspokoic panstwo."
 mission_investigation_into_the_riots: "Śledztwo w Sprawie Zamieszek"
 mogwarts: "Mogwarts"
 mogwarts_desc: "Elitarna szkola looksmaxxingu, retoryki i mentorstwa prowadzona przez PUAsów. Jej kadra ksztalci nie tylko teoretyków gry spolecznej, ale tez nowych urzedników i propagatorów panstwowej doktryny."
 mission_investigation_into_the_riots_desc: "Sama sila nie wystarczy, jesli chcemy naprawde zrozumiec, kto rozpalil kraj od srodka. Potrzeba czasu, przesluchan i politycznej cierpliwosci, by wskazac rzeczywistego sprawce zamieszek."
 mission_prepare_the_armies: "Przygotować Wojska!"
 mission_prepare_the_armies_desc: "Skoro znamy juz wroga, pora przejsc od politycznego chaosu do planowej mobilizacji. Szkolenie, koncentracja sil i wejscie armii na wyzsza stope gotowosci powinny przygotowac Looksmaxie do nadchodzacej wojny z Danielem i Ukraina."
 mission_daniel_must_die: "Daniel musi zginąć!"
 mission_daniel_must_die_desc: "Skoro sledztwo wskazalo winnego, nie ma juz miejsca na polsrodki. Trzeba przygotowac prawne i wojskowe podstawy do rozprawy z Danielem, nawet jesli na razie kryje sie jeszcze pod tagiem BUG."
 mission_bull_rodeo: "Bycze Rodeo"
 mission_bull_rodeo_desc: "Skoro Byd pokazalo juz, ze patrzy Ziolkowi na rece i rozwaza odwet za jelenia, trzeba uprzedzic ruch Kuska i przygotowac pelne podstawy do wojny o ostateczne rozbicie BYD."
 mission_ukraine_first: "Najpierw Ukraina!"
 mission_ukraine_first_desc: "Zanim przyjdzie czas na ostateczne rozprawy personalne, trzeba rozwalic szerszy uklad sil, ktory stoi po drugiej stronie. Ukraina musi zostac formalnie oznaczona jako pierwszy cel wojenny."
 mission_repolonization_process: "Proces Repolonizacji"
 mission_repolonization_process_desc: "Po otwarciu wschodniego kierunku trzeba uruchomic trwaly aparat administracyjny do repolonizacji nowo podporzadkowanych ziem. Misja odblokowuje specjalna akcje gabinetowa, ktora pozwala prowadzic repolonizacje w wybranych prowincjach i laczy przyspieszona asymilacje z zachecaniem do migracji tam, gdzie wciaz zyja ludy spoza polskiej grupy kulturowej."
 pua_repolonization_process_reward_tt: "Zyskuje reforme rzadowa §YDyrektoriat Repolonizacyjny§!, ktora daje §G+1§! slot reform rzadowych, §G+10%§! efektywnosci gabinetu i odblokowuje akcje gabinetowa §YKampania Repolonizacyjna§!."
 pua_country_rioters: "Motłoch"
 mission_integration_of_new_peoples: "Integracja Nowych Ludów"
 mission_integration_of_new_peoples_desc: "Nowe ziemie to nie tylko terytorium, ale i ludzie, których trzeba wlaczyc do panstwowego organizmu. Skupiony wysilek administracyjny i spoleczny moze przez pewien czas wyraznie przyspieszyc integracje, asymilacje i konwersje."
 mission_femboy_legal_status: "Status Prawny Femboyów"
 mission_femboy_legal_status_desc: "Po podboju ziem FMB i TMB nie da sie dluzej odwlekac formalnego uregulowania ich statusu. Najpierw jednak trzeba rzeczywiscie zintegrowac te tereny z panstwem."
 mission_cannabis_question: "Kwestia Konopna"
 mission_cannabis_question_desc: "Dawne ziemie GER nie moga wiecznie pozostawac w prawnej i gospodarczej szarosci. Zanim rozstrzygniemy kwestie ziola, musimy porzadnie zintegrowac te obszary z Looksmaxia."
 mission_one_rabbi_will_say: "Jeden Rabin Powie..."
 mission_one_rabbi_will_say_desc: "Status ludnosci zydowskiej na dawnych ziemiach YID wymaga politycznego rozstrzygniecia. Zanim zapadnie decyzja, te tereny musza zostac realnie wlaczone do naszego organizmu panstwowego."
 mission_valonian_cavalry: "Kawaleria Walońska"
 mission_valonian_cavalry_desc: "Rozgoryczona jazda z dawnych ziem WAL nie uspokoi sie sama. Najpierw trzeba zintegrowac te obszary, a dopiero potem rozwiazac sprawe samej kawalerii."
 mission_infrastructure_renovation: "Renowacja Infrastruktury"
 mission_infrastructure_renovation_desc: "Po latach wojen i ekspansji pora naprawic drogi panstwa. Skupiona inwestycja w komunikacje i aparat administracyjny ulatwi scalanie kraju oraz obnizy koszt dalszej rozbudowy sieci drogowej."
 mission_second_government_seat: "Druga Siedziba Rządowa"
 mission_second_government_seat_desc: "Rzeszow powinien zostac przeksztalcony w dodatkowy filar administracji panstwowej. Ustanowienie tam lokalnego gubernatora odciazy stolice i wzmocni kontrole nad regionem."
 mission_jedzeniot_line: "Linia Jedzeniota"
 mission_jedzeniot_line_desc: "Trzeba umocnic kluczowe punkty pasa obronnego i stworzyc spojna linie forteczna. To kosztowny projekt, ale zapewni panstwu silne zaplecze obronne na zachodzie."
 mission_autostradka: "Autostradka"
 mission_autostradka_desc: "Najwazniejsza os komunikacyjna panstwa powinna polaczyc Mielec, Debice i Rzeszow nowoczesna droga. Nawet jesli nie wszystkie odcinki pozostaja w naszych rekach, trzeba zbudowac tyle trasy, ile aktualnie kontrolujemy."
 mission_crusade_against_the_hairmans: "Krucjata na Włosmanów"
 mission_crusade_against_the_hairmans_desc: "Po otwarciu drogi na Valonę możemy nadać naszej dalszej ekspansji wymiar niemal świętej wojny. Trzeba przygotować religijny pretekst do starcia z Włosmanami z UWU."
 mission_ziolentrop_wronotow_pact: "Pakt Ziółentrop-Wronotow"
 mission_ziolentrop_wronotow_pact_desc: "Po rozbiciu jednego z pierwszych wrogow mozemy wejsc w uklad z Szymonem Wrona i zaproponowac rozbior panstwa CKZ. Jesli przyjma, podzielimy lupy. Jesli odmowia, obie strony dostana formalny pretekst do wojny."
 mission_claim_mielec: "Przejąć Mielec"
 mission_claim_mielec_desc: "Po rozpracowaniu obu głównych wrogów przeklęty jeleń spierdolił na Nerdzisko. Potrzebujemy więcej terytorium żeby przygotować się do wojny z Chorzelowem."
 mission_maritime_question: "Kwestia Morska"
 mission_maritime_question_desc: "Dostep do morza mozna zalatwic na kilka sposobow. Mozemy uderzyc na Szczucin, ruszyc na Tvierdze albo sprobowac kupic ich czesc wybrzeza. Czas podjac decyzje."
 mission_administer_mielec: "Administrować Mielcem"
 mission_administer_mielec_desc: "Sam podboj Mielca nie wystarczy. Trzeba tam zaprowadzic porzadek, zintegrowac lokacje i podniesc realna kontrole administracyjna nad cala prowincja."
 mission_consolidate_rule: "Konsolidacja Władzy"
 mission_consolidate_rule_desc: "Po podporzadkowaniu Mielca i podbojach na zachodzie trzeba uspokoic panstwo, zintegrowac nowe ziemie i umocnic realna wladze Ziolkowskiego."
 pua_consolidate_rule_integrated_conquests_tt: "Zintegrowano wszystkie zdobyte lokacje po McDonalds i Bukajstwie."
 pua_political_events.1.title: "Oferta dla Tvierdzy"
 pua_political_events.1.desc: "Przygotowalismy formalna oferte przejecia wszystkich lokacji Tvierdzy w prowincji mieleckiej."
 pua_political_events.1.a: "Wysłać ofertę"
 pua_political_events.1.a.ai_accept_tt: "AI Tvierdzy zaakceptuje oferte i odda swoje lokacje w prowincji mieleckiej."
 pua_political_events.2.title: "Looksmaxia Chce Kupić Mieleckie Wybrzeże"
 pua_political_events.2.desc: "Looksmaxia sklada oferte przejecia wszystkich naszych lokacji w prowincji mieleckiej. Mozemy zaakceptowac i uniknac wojny albo odmowic, ryzykujac natychmiastowe roszczenia."
 pua_political_events.2.a: "Przyjąć ofertę"
 pua_political_events.2.b: "Odrzucić i ryzykować wojnę"
 pua_political_events.3.title: "Tvierdza Przyjęła Ofertę"
 pua_political_events.3.desc: "Tvierdza zgodzila sie oddac swoje lokacje w prowincji mieleckiej. Dostep do wybrzeza zostal zabezpieczony bez koniecznosci dalszej wojny."
 pua_political_events.3.a: "Znakomicie"
 pua_political_events.4.title: "Tvierdza Odrzuciła Ofertę"
 pua_political_events.4.desc: "Tvierdza odrzucila nasza propozycje. Dyplomacja zawiodla, ale przynajmniej mamy teraz formalny pretekst do wojny o mieleckie wybrzeze."
 pua_political_events.4.a: "W takim razie wojna"
 pua_political_events.5.title: "Pakt Ziółentrop-Wronotow"
 pua_political_events.5.desc: "Mozemy zaproponowac Szymonowi Wronie wspolny rozbior panstwa CKZ. Jesli sie zgodzi, zawrzemy sojusz i wspolnie nacisniemy na cel. Jesli odmowi, Ziolkowski bedzie musial zdecydowac, czy odpuscic czy dzialac samemu."
 pua_political_events.5.a: "Wysłać propozycję"
 pua_political_events.6.title: "Propozycja dla Szymona Wrony"
 pua_political_events.6.desc: "Looksmaxia proponuje wspolny rozbior CKZ. W razie zgody zawrzemy sojusz i podzielimy lupy: Wrona wezmie ryglice, rzepiennik_strzyzewski, szerzyny, bobowa, luzna i moszczenica, a Ziolkowski biecz, gorlice, ropa, sekowa i uscie_gorlickie."
 pua_political_events.6.a: "Zgodzić się i zawrzeć sojusz"
 pua_political_events.6.b: "Odmówić"
 pua_political_events.7.title: "Oferta Rozbioru CKZ"
 pua_political_events.7.desc: "Looksmaxia i Szymon Wrona wystepuja wspolnie z propozycja rozbioru naszego panstwa. Jesli zaakceptujemy, oddamy wskazane lokacje PUA i AUR. Jesli odmowimy, obie strony dostana formalny pretekst do wojny."
 pua_political_events.7.a: "Przyjąć warunki"
 pua_political_events.7.b: "Odrzucić i zaryzykować wojnę"
 pua_political_events.8.title: "Pakt Doszedł do Skutku"
 pua_political_events.8.desc: "Szymon Wrona zgodzil sie na wspolne dzialanie, sojusz zostal zawarty, a CKZ przyjelo warunki rozbioru. Looksmaxia przejela swoja czesc ukladu bez koniecznosci natychmiastowej wojny."
 pua_political_events.8.a: "Znakomicie"
 pua_political_events.9.title: "Wrona Odmówił"
 pua_political_events.9.desc: "Szymon Wrona nie chce wchodzic w ten uklad. Ziolkowski musi teraz zdecydowac, czy odpuscic ten plan, czy samemu doprowadzic grozby wobec Tuchowa do konca."
 pua_political_events.9.a: "Na razie odpuśćmy"
 pua_political_events.9.b: "Zniszczymy Tuchów sami"
 pua_political_events.10.title: "Presja Przechodzi w Groźbę Wojny"
 pua_political_events.10.desc: "Dyplomacja zawiodla, ale formalny pretekst do wojny jest gotowy. Ziolkowski moze teraz przejsc do realizacji swoich gróźb."
 pua_political_events.10.a: "Niech tak będzie"
 pua_political_events.11.title: "Wielka Uczta"
 pua_political_events.11.desc: "McDonalds zostal pokonany, a Ziolkowski moze wreszcie zasiąść do symbolicznej uczty zwyciezcy. Pozostaje tylko zdecydowac, co znajdzie sie na glownym daniu."
 pua_political_events.11.a: "Zjeść Juleczkę"
 pua_political_events.11.b: "Zjeść Kocik"
 pua_political_events.11.c: "Powstrzymać się od jedzenia"
 pua_political_events.12.title: "Kwestia Morska"
 pua_political_events.12.desc: "Wybrzeze stoi przed nami otworem, ale droga do niego nie jest jedna. Mozemy uderzyc na Szczucin, rozpocząć wojnę o resztę mieleckiego z Tvierdzą albo spróbować załatwić sprawę złotem."
 pua_political_events.12.a: "Wojna ze Skrzyszowem"
 pua_political_events.12.b: "Wojna z Tvierdzą"
 pua_political_events.12.c: "Oferta zakupu dla Tvierdzy"
 pua_political_events.13.title: "Znaleziono Sprawcę!"
 pua_political_events.13.desc: "Po miesiacach sledztwa wszystko stalo sie jasne: to Daniel byl tym, ktory od srodka zatruwal panstwo Ziolka, podsycal zamieszki i rozmywal porzadek. Wreszcie wiadomo, kogo nalezy obarczyc wina za ten syf."
 pua_political_events.13.a: "Ten Jebany Jeleń!"
 pua_political_events.14.title: "Jeleń Przejechany"
 pua_political_events.14.desc: "Wojna dobiegla konca, a Daniel zostal wreszcie dopadniety politycznie i militarnie. Jego intryga przestaje truc panstwo Ziolka, pozostaje tylko zdecydowac, czy jelenia dobic ostatecznie."
 pua_political_events.14.a: "Dobić jelenia"
 pua_political_events.14.b: "Wystarczy, że przegrał"
 pua_political_events.15.title: "Raz, dwa, trzy, bydle patrzy"
 pua_political_events.15.desc: "Wieści o losie Daniela dotarly do Kuska. Bydle patrzy teraz na Ziolka i moze uznac, ze pora przejechac go za to, co zrobil jeleniowi, albo odpuscic i zajac sie swoimi sprawami."
 pua_political_events.15.a: "Niech Ziółek zyje dalej"
 pua_political_events.15.b: "Dojechać go za jelenia"
 pua_political_events.16.title: "Raz, dwa, trzy, bydle patrzy"
 pua_political_events.16.desc: "Kusek nie zamierza odpuscic. Po sprawie z jeleniem w BYD zapadla decyzja: Ziolkowi trzeba odpowiedziec sila. Bydgoska machina rusza, a nad panstwem zbiera sie nowa wojna."
 pua_political_events.16.a: "Bydle faktycznie patrzy"
 cb_pua_daniel_hunt: "Polowanie na Daniela"
 PUA_DANIEL_HUNT_WAR_NAME: "Wojna o Daniela"
 cb_byczy_rozjazd: "Byczy Rozjazd"
 BYCZY_ROZJAZD_WAR_NAME: "Byczy Rozjazd"
