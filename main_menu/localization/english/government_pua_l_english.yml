l_english:
 pua_repolonization_directorate: "Dyrektoriat Repolonizacyjny"
 pua_repolonization_directorate_desc: "Staly aparat administracyjny odpowiedzialny za repolonizacje nowo podporzadkowanych ziem, laczacy presje asymilacyjna z kontrolowana migracja wewnetrzna."
 pua_redpill_doctrine: "Doktryna Redpill"
 pua_redpill_doctrine_desc: "Looksmaxia przyjmuje aktywistyczna doktryne samodoskonalenia, sprawczosci i nauki zasad gry spolecznej. Incele otrzymuja nadzieje na awans, a PUAsi wyrastaja na mentorow nowego porzadku."
 pua_blackpill_doctrine: "Doktryna Blackpill"
 pua_blackpill_doctrine_desc: "Looksmaxia uznaje brutalna hierarchie swiata za nieunikniona prawde. Chady i rozgoryczeni Incele odnajduja wspolny jezyk w panstwie twardszym, bardziej cynicznym i bardziej bezwzglednym dla swoich przeciwnikow."
 pua_dupczenie_reform: "Reforma Dupczenia"
 pua_dupczenie_reform_desc: "Panstwo rozpoczyna aktywna ingerencje w rynek matrymonialny i stosunki spoleczne, by podniesc dzietnosc oraz przechylic ustrój na korzysc Inceli. Reforma jest jeszcze toporna i politycznie kosztowna, ale stanowi fundament pod dalsza przebudowe porzadku spolecznego."
 pua_repolonization_campaign: "Proces Repolonizacji"
 pua_repolonization_campaign_desc: "This will direct administration, settlement pressure and cultural engineering toward a [province|e], accelerating assimilation and making it more attractive for internal migration."
 pua_repolonization_select_province: "Select the [province|e] to begin the repolonization process in:"
 pua_repolonization_no_provinces: "@trigger_no! No valid [provinces|e] available"
 pua_repolonization_campaign_action: "Repolonize [SCOPE.sProvince('target').GetNameWithNoTooltip]"
 pua_repolonization_campaign_active: "Repolonizing [SCOPE.sProvince('target').GetNameWithHighlightOnly]"
 pua_repolonization_campaign_action_progress: "[SCOPE.sProvince('target').GetCulturePercentage(SCOPE.sCountry('actor').GetCulture)|V2%]"
 pua_repolonization_campaign_action_progress_wordier: "[cultural_unity|e] of [SCOPE.sProvince('target').GetNameWithNoTooltip] in [SCOPE.sCountry('actor').GetCulture.GetName] culture is [SCOPE.sProvince('target').GetCulturePercentage(SCOPE.sCountry('actor').GetCulture)|V2%]"
 pua_repolonization_campaign_action_progress_long_wordier: "@culture! [SCOPE.sProvince('target').GetCulturePercentage(SCOPE.sCountry('actor').GetCulture)|V2%] \n\n@pop_assimilation_speed! [SCOPE.sProvince('target').GetProvinceLocationModifier('local_pop_assimilation_speed')|+=2]\n@migration_attraction! [SCOPE.sProvince('target').GetProvinceLocationModifier('local_migration_attraction')|+=2]"
 pua_repolonization_campaign_action_progress_tooltip: "Repolonizing @province! [SCOPE.sProvince('target').GetName]:\n[SCOPE.sProvince('target').GetCulturalInfo]"
